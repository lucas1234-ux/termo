<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo - Futurista</title>
    <style>
        :root {
            --bg-1: #081b2b;
            --bg-2: #112d45;
            --panel: rgba(11, 32, 49, 0.9);
            --panel-strong: rgba(14, 39, 58, 0.96);
            --blue-1: #0d3b5b;
            --blue-2: #1a5d8a;
            --blue-3: #6bb0d9;
            --white: #edf4fb;
            --muted: #afc5d7;
            --yellow-1: #f7d35d;
            --yellow-2: #ffea9b;
            --border: rgba(191, 220, 255, 0.18);
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(26, 93, 138, 0.7), transparent 40%),
                linear-gradient(180deg, #061722 0%, var(--bg-1) 40%, var(--bg-2) 100%);
            color: var(--white);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01)),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 0,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 38px
                );
            pointer-events: none;
        }

        body::after {
            content: "TERMO";
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 0.55em;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--yellow-1);
            text-transform: uppercase;
            opacity: 0.9;
        }

        #jogo {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            padding: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(11, 28, 41, 0.9), rgba(8, 18, 27, 0.92));
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(255,255,255,0.04),
                inset 0 0 30px rgba(107, 176, 217, 0.1);
            border-radius: 12px;
        }

        #jogo::before {
            content: "";
            display: block;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, var(--yellow-1), #fff6bf, var(--yellow-1));
            border-radius: 12px 12px 0 0;
            margin-bottom: 18px;
            box-shadow: 0 0 18px rgba(247, 211, 93, 0.35);
        }

        #jogo form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 0 0 12px;
            padding: 10px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        #jogo form:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        #jogo form input[type="text"] {
            width: 52px;
            height: 58px;
            border: 1px solid rgba(172, 210, 255, 0.25);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(18, 43, 62, 0.9), rgba(9, 25, 38, 0.82));
            color: var(--white);
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
            transition: all 0.2s ease;
        }

        #jogo form input[type="text"]:focus {
            outline: none;
            border-color: var(--yellow-1);
            box-shadow:
                0 0 0 3px rgba(247, 211, 93, 0.16),
                inset 0 2px 8px rgba(0,0,0,0.35);
            transform: translateY(-1px);
        }

        #jogo form input[type="submit"] {
            margin-top: 10px;
            padding: 14px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(180deg, var(--yellow-2), var(--yellow-1));
            color: #0b1a2a;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(247, 211, 93, 0.28);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #jogo form input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(247, 211, 93, 0.34);
        }

        h2 {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            margin: 24px 0 10px;
            color: var(--yellow-1);
            font-size: 0.75rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-weight: 800;
        }

        #Letras\ utilizadas,
        [id="Letras utilizadas"] {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            min-height: 58px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            background: rgba(11, 22, 33, 0.75);
            color: var(--white);
            font-weight: 700;
            letter-spacing: 0.18em;
            word-break: break-word;
            box-shadow: inset 0 0 18px rgba(9, 28, 39, 0.55);
        }

        @media (max-width: 520px) {
            #jogo {
                padding: 12px;
            }

            #jogo form {
                gap: 8px;
            }

            #jogo form input[type="text"] {
                width: 42px;
                height: 50px;
                font-size: 1.35rem;
            }

            #jogo form input[type="submit"] {
                width: 100%;
            }

            body::after {
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>
<body>
    <div id="jogo"></div>
    <h2>Letras Utilizadas</h2>
    <div id="letrasUtilizadas"></div>
    <script src="termo.js"></script>
</body>
</html>
