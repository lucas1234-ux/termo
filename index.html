<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo - Futurista</title>
    <style>
        :root {
            --bg-1: #0b0b0b;
            --bg-2: #1a1a1a;
            --panel: rgba(15, 15, 15, 0.9);
            --panel-strong: rgba(24, 24, 24, 0.96);
            --red-1: #8f1d1d;
            --red-2: #c62828;
            --red-3: #ef5350;
            --white: #f5f5f5;
            --muted: #d0d0d0;
            --gold-1: #d4af37;
            --gold-2: #f2d675;
            --border: rgba(212, 175, 55, 0.25);
            --shadow: rgba(0, 0, 0, 0.55);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(143, 29, 29, 0.4), transparent 40%),
                linear-gradient(180deg, #050505 0%, var(--bg-1) 40%, var(--bg-2) 100%);
            color: var(--white);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01)),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 0,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 38px
                );
            pointer-events: none;
        }

        body::after {
            content: "TERMO";
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 0.55em;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--gold-1);
            text-transform: uppercase;
            opacity: 0.95;
        }

        #jogo {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            padding: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.96), rgba(5, 5, 5, 0.96));
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                inset 0 0 0 1px rgba(255,255,255,0.04),
                inset 0 0 30px rgba(143, 29, 29, 0.18);
            border-radius: 12px;
        }

        #jogo::before {
            content: "";
            display: block;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, var(--gold-1), var(--gold-2), var(--gold-1));
            border-radius: 12px 12px 0 0;
            margin-bottom: 18px;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
        }

        #jogo form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 0 0 12px;
            padding: 10px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        #jogo form:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        #jogo form input[type="text"] {
            width: 52px;
            height: 58px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            background: linear-gradient(180deg, #242424, #101010);
            color: var(--white);
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        #jogo form input[type="text"]:focus {
            outline: none;
            border-color: var(--gold-1);
            box-shadow:
                0 0 0 3px rgba(212, 175, 55, 0.2),
                inset 0 2px 8px rgba(0,0,0,0.5);
            transform: translateY(-1px);
        }

        #jogo form input[type="submit"] {
            margin-top: 10px;
            padding: 14px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(180deg, var(--gold-2), var(--gold-1));
            color: #111111;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(212, 175, 55, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #jogo form input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(212, 175, 55, 0.35);
        }

        h2 {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            margin: 24px 0 10px;
            color: var(--gold-1);
            font-size: 0.75rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-weight: 800;
        }

        #letrasUtilizadas {
            position: relative;
            z-index: 1;
            width: min(100%, 470px);
            min-height: 58px;
            padding: 16px 18px;
            border: 1px solid rgba(212, 175, 55, 0.22);
            border-radius: 10px;
            background: rgba(12, 12, 12, 0.88);
            color: var(--white);
            font-weight: 700;
            letter-spacing: 0.18em;
            word-break: break-word;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 520px) {
            #jogo {
                padding: 12px;
            }

            #jogo form {
                gap: 8px;
            }

            #jogo form input[type="text"] {
                width: 42px;
                height: 50px;
                font-size: 1.35rem;
            }

            #jogo form input[type="submit"] {
                width: 100%;
            }

            body::after {
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>
<body>
    <div id="jogo"></div>
    <h2>Letras Utilizadas</h2>
    <div id="letrasUtilizadas"></div>
    <script src="termo.js"></script>
</body>
</html>
