<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10283d">
    <title>Termo — desafio de palavras</title>
    <style>
        :root {
            color-scheme: dark;
            --navy: #10283d;
            --deep-blue: #0a1a29;
            --blue: #1d5274;
            --ice: #f3f5ef;
            --muted: #a9bac2;
            --yellow: #f1c84b;
            --line: rgba(209, 225, 228, .2);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(32px, 8vh, 78px) 20px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ice);
            background:
                radial-gradient(ellipse at 50% 0%, rgba(35, 91, 123, .48), transparent 54%),
                repeating-linear-gradient(2deg, transparent 0 42px, rgba(255,255,255,.012) 43px 44px),
                linear-gradient(145deg, #142f43, var(--deep-blue) 70%);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        body::before {
            content: "TERMO  /  DESAFIO DE PALAVRAS";
            display: block;
            margin-bottom: 12px;
            color: var(--yellow);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .24em;
            text-align: center;
        }

        body::after {
            content: "CINCO LETRAS · CINCO TENTATIVAS";
            order: 3;
            margin-top: 30px;
            color: var(--muted);
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-align: center;
        }

        #jogo {
            width: min(100%, 440px);
            padding: 22px;
            border: 1px solid var(--line);
            border-top: 2px solid rgba(241, 200, 75, .82);
            border-radius: 5px;
            background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
            box-shadow: 0 24px 70px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.06);
            backdrop-filter: blur(8px);
        }

        #jogo form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin: 0 0 12px;
            padding: 0 0 12px;
            border-bottom: 1px solid rgba(209, 225, 228, .11);
        }

        #jogo form:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }

        #jogo form input[type="text"] {
            width: clamp(42px, 11vw, 54px);
            height: clamp(48px, 12vw, 60px);
            padding: 0;
            border: 1px solid rgba(209, 225, 228, .32);
            border-radius: 4px;
            outline: none;
            background: rgba(6, 21, 33, .72);
            color: var(--ice);
            font: 800 1.45rem/1 "Trebuchet MS", "Segoe UI", sans-serif;
            text-align: center;
            text-transform: uppercase;
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }

        #jogo form input[type="text"]:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(241, 200, 75, .16);
            transform: translateY(-2px);
        }

        #jogo form input[type="submit"] {
            min-height: 44px;
            margin: 8px 0 0 4px;
            padding: 0 22px;
            border: 1px solid var(--yellow);
            border-radius: 3px;
            background: var(--yellow);
            color: var(--deep-blue);
            cursor: pointer;
            font: 900 .78rem/1 "Trebuchet MS", "Segoe UI", sans-serif;
            letter-spacing: .13em;
            text-transform: uppercase;
            transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
        }

        #jogo form input[type="submit"]:hover {
            background: #ffda69;
            box-shadow: 0 5px 20px rgba(241, 200, 75, .2);
            transform: translateY(-2px);
        }

        #jogo form input[type="submit"]:focus-visible {
            outline: 2px solid var(--ice);
            outline-offset: 3px;
        }

        h2 {
            order: 2;
            width: min(100%, 440px);
            margin: 28px 0 10px;
            color: var(--yellow);
            font-size: .8rem;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        #\4c etras\20 utilizadas,
        [id="Letras utilizadas"] {
            order: 2;
            width: min(100%, 440px);
            min-height: 54px;
            padding: 15px 16px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: rgba(255,255,255,.045);
            color: var(--ice);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .28em;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            body { padding-right: 14px; padding-left: 14px; }
            #jogo { padding: 16px 12px; }
            #jogo form { gap: 6px; }
            #jogo form input[type="submit"] { margin-left: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="jogo">

    </div>
    <h2>Letras Utilizadas</h2>
    <div id="Letras utilizadas"></div>
    <script src="termo.js"></script>
</body>
</html>
